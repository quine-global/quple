name: flatpak

# Builds Quple for Linux as a Flatpak (desktop/flatpak/) and uploads it to
# the bucket's flatpak/incoming/ (.forgejo/flatpak-publish.sh), for both
# architectures: on every push to main that touches the desktop app, or by
# hand. quine-global/flatpak-repo publishes it from there to Quine Linux's
# Flatpak repo (flatpak.quineglobal.com) within about 10 minutes; Quine
# Linux preinstalls Quple from that repo.
#
# Secrets/variables (quine-global, org-wide): MINIO_SECRET_KEY,
# MINIO_ACCESS_KEY (variable or secret). Optional variables:
# MINIO_ENDPOINT (default https://s3.quineglobal.com), MINIO_BUCKET
# (default quine-linux).

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".forgejo/workflows/flatpak.yml"
      - ".forgejo/flatpak-*.sh"
  workflow_dispatch:

concurrency:
  group: quple-flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  MINIO_ENDPOINT: ${{ vars.MINIO_ENDPOINT || 'https://s3.quineglobal.com' }}
  MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'quine-linux' }}
  MINIO_ACCESS_KEY: ${{ vars.MINIO_ACCESS_KEY || secrets.MINIO_ACCESS_KEY }}

jobs:
  x86_64:
    runs-on: runner-x86-linux
    steps:
      - uses: https://forge.in.quineglobal.com/quine-global/mirror-actions-checkout@v4
      - name: Build and upload
        env:
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: bash .forgejo/flatpak-publish.sh

  aarch64:
    runs-on: runner-arm64-linux
    steps:
      - uses: https://forge.in.quineglobal.com/quine-global/mirror-actions-checkout@v4
      - name: Build and upload
        env:
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: bash .forgejo/flatpak-publish.sh
