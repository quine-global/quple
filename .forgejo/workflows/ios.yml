# Builds Quple for iPhone (mobile/) and publishes it as an AltStore source:
# on every push to main that touches mobile/, build the .ipa on the Mac
# runner (unsigned: AltStore signs it with the person's own Apple ID) and
# put it, its icon and source.json on this repo's `altstore` release.
#
# In AltStore: Sources → + →
#   https://git.quineglobal.com/quine-global/quple/releases/download/altstore/source.json
# (git.quineglobal.com serves public repos' release files from the forge,
# which is tailnet-only.) New builds then show up as updates.
#
# Versions: 1.0.<run number>, build <run number>, so each build is newer.
name: ios

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.forgejo/workflows/ios.yml', '.forgejo/altstore-source.py']
  workflow_dispatch:

concurrency:
  group: ios-altstore
  cancel-in-progress: false

jobs:
  ipa:
    # The Mac mini: Xcode, CocoaPods and Node on the host.
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      BUILD: ${{ github.run_number }}
      VERSION: 1.0.${{ github.run_number }}
      RELEASE_TAG: altstore
      PUBLIC: https://git.quineglobal.com/${{ github.repository }}/releases/download/altstore
    steps:
      - uses: https://forge.in.quineglobal.com/quine-global/mirror-actions-checkout@v4

      - name: Dependencies
        working-directory: mobile
        env:
          LANG: en_US.UTF-8
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          (cd ios && pod install)

      - name: Build
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace QupleMobile.xcworkspace -scheme QupleMobile \
            -configuration Release -sdk iphoneos -destination generic/platform=iOS \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -40; tail -20 build.log; exit 1; }
          grep -E '\*\* BUILD' build.log
          rm -rf ipa && mkdir -p ipa/Payload out
          cp -R build/Build/Products/Release-iphoneos/QupleMobile.app ipa/Payload/
          (cd ipa && zip -qry "../out/Quple-$BUILD.ipa" Payload)
          cp QupleMobile/Images.xcassets/AppIcon.appiconset/AppIcon-1024.png out/icon.png
          ls -l out

      - name: AltStore source
        run: |
          python3 .forgejo/altstore-source.py \
            --ipa "mobile/ios/out/Quple-$BUILD.ipa" --version "$VERSION" --build "$BUILD" \
            --public "$PUBLIC" --commit "${GITHUB_SHA::7}" > mobile/ios/out/source.json
          cat mobile/ios/out/source.json

      # The one `altstore` release holds the latest build only: its files are
      # replaced, and older Quple-*.ipa removed.
      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: https://forge.in.quineglobal.com/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: token $TOKEN")
          release=$(curl -sS "${auth[@]}" "$API/releases/tags/$RELEASE_TAG")
          id=$(echo "$release" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id") or "")')
          if [ -z "$id" ]; then
            id=$(curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -X POST "$API/releases" \
              -d "{\"tag_name\": \"$RELEASE_TAG\", \"target_commitish\": \"$GITHUB_SHA\", \"name\": \"Quple for iPhone (AltStore)\",
                   \"body\": \"The latest iPhone build, as an AltStore source: add $PUBLIC/source.json in AltStore (Sources → +).\"}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            release=$(curl -fsS "${auth[@]}" "$API/releases/$id")
          fi
          # Remove what this run replaces, and older builds.
          echo "$release" | python3 -c '
          import json, sys
          for a in json.load(sys.stdin).get("assets", []):
              if a["name"] in ("source.json", "icon.png") or a["name"].startswith("Quple-"):
                  print(a["id"], a["name"])' | while read -r aid name; do
            curl -fsS "${auth[@]}" -X DELETE "$API/releases/$id/assets/$aid"
            echo "removed $name"
          done
          # The ipa and icon first: source.json points at them.
          for f in "Quple-$BUILD.ipa" icon.png source.json; do
            curl -fsS -o /dev/null "${auth[@]}" -X POST "$API/releases/$id/assets?name=$f" \
              -F "attachment=@mobile/ios/out/$f"
            echo "uploaded $f"
          done
          echo "AltStore source: $PUBLIC/source.json"
