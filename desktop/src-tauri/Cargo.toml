[package]
name = "quple"
version = "0.1.0"
description = "Desktop app that calls other Quple users over Jitsi Meet"
authors = ["Quple"]
edition = "2021"

[lib]
name = "quple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openidconnect = "4"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "macros"] }

# Updates on macOS: Sparkle (src/updater.rs).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-sparkle-updater = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[features]
# This feature is used for production builds or when `devPath` points to the
# filesystem and the built-in dev server is disabled.
custom-protocol = ["tauri/custom-protocol"]
